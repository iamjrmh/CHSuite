name: CHMenuChanger Asset Processor

on:
  workflow_dispatch:
    inputs:
      background:
        description: 'Background name to replace'
        required: true
        type: choice
        options:
          - Spray
          - Pastel Burst
          - Groovy
          - Grains
          - Blue Rays
          - Alien
          - Autumn
          - Light
          - Dark
          - Classic
          - Surfer
          - SurferAlt
          - Rainbow
          - Animated
          - Logo_Transparent
      replacement_url:
        description: 'URL to replacement image (PNG/JPG)'
        required: true
        type: string

  repository_dispatch:
    types: [chmenuchanger]

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements-chmenuchanger.txt

      - name: Prepare input directory
        run: |
          mkdir -p input_data
          # Copy asset files from docs/assets/
          if [ -d "docs/assets" ]; then
            cp docs/assets/*.assets input_data/ 2>/dev/null || true
            cp docs/assets/*.resS input_data/ 2>/dev/null || true
            echo "Copied files from docs/assets/:"
            ls -la input_data/
          else
            echo "ERROR: docs/assets/ directory not found"
            exit 1
          fi

      - name: Download replacement image
        env:
          REPLACEMENT_URL: ${{ github.event.inputs.replacement_url || github.event.client_payload.replacement_url }}
        run: |
          if [ -n "$REPLACEMENT_URL" ] && [ "$REPLACEMENT_URL" != "https://placeholder" ]; then
            echo "Downloading replacement image from $REPLACEMENT_URL"
            curl -L -o replacement_image.png "$REPLACEMENT_URL" || exit 1
            ls -la replacement_image.png
          else
            echo "ERROR: No replacement URL provided"
            exit 1
          fi

      - name: Validate input files
        run: |
          if [ ! -f "input_data/sharedassets1.assets" ] && [ ! -f "input_data/globalgamemanagers.assets" ]; then
            echo "ERROR: No .assets files found in docs/assets/"
            echo "Please ensure asset files are present in docs/assets/"
            exit 1
          fi

          if [ ! -f "replacement_image.png" ]; then
            echo "ERROR: No replacement image provided"
            exit 1
          fi

      - name: Process assets
        env:
          BACKGROUND: ${{ github.event.inputs.background || github.event.client_payload.background }}
        run: |
          echo "Processing background: $BACKGROUND"
          python chmenuchanger_cli.py \
            -i input_data \
            -o output_data \
            -r replacement_image.png \
            -b "$BACKGROUND" \
            -v

      - name: Create artifact zip
        run: |
          cd output_data
          zip -r ../modified-assets.zip *.assets 2>/dev/null || zip -r ../modified-assets.zip . 2>/dev/null || true
          cd ..
          ls -la modified-assets.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modified-assets
          path: modified-assets.zip
          retention-days: 7
          if-no-files-found: error